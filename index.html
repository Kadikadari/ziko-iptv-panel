<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZIKO IPTV PANEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>ZIKO IPTV Control Panel</h1>
    <p class="subtitle">Remote playlist management for your IPTV player</p>

    <!-- DOWNLOAD APP -->
    <div class="card">
        <h2>Application</h2>
        <a href="https://github.com/Kadikadari/mein.servr/raw/refs/heads/main/app-debug.apk" download>
            <button>تحميل التطبيق</button>
        </a>
    </div>

    <!-- DEVICE -->
    <div class="card">
        <h2>Device</h2>
        <input type="text" id="mac" placeholder="MAC Address (AA:BB:CC:DD:EE:FF)">
        <button onclick="loadDevice()">Load Device</button>
    </div>

    <!-- PLAYLIST TYPE -->
    <div class="card">
        <h2>Playlist Type</h2>

        <select id="playlistType" onchange="switchType()">
            <option value="">Select playlist type</option>
            <option value="m3u">M3U Playlist</option>
            <option value="xtream">Xtream Codes</option>
            <option value="stalker">MAG / Stalker Portal</option>
        </select>

        <!-- M3U -->
        <div class="type-box" id="m3uBox">
            <input type="text" id="m3uUrl" placeholder="M3U URL">
            <button onclick="savePlaylist()">Save M3U</button>
        </div>

        <!-- XTREAM -->
        <div class="type-box" id="xtreamBox">
            <input type="text" id="xtServer" placeholder="Server URL">
            <input type="text" id="xtUser" placeholder="Username">
            <input type="text" id="xtPass" placeholder="Password">
            <button onclick="savePlaylist()">Save Xtream</button>
        </div>

        <!-- STALKER -->
        <div class="type-box" id="stalkerBox">
            <input type="text" id="stalkerPortal" placeholder="Portal URL">
            <input type="text" id="stalkerMac" placeholder="MAC Address for Stalker">
            <button onclick="savePlaylist()">Save MAG/Stalker</button>
        </div>

    </div>

    <!-- STATUS -->
    <div class="card info">
        <h2>Device Status</h2>
        <pre id="status">No device loaded</pre>
    </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.30.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.30.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<script src="script.js"></script>
</body>
</html>
